<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>You Cannot TAS PC Games</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Yes, you can TAS PC games!">
  <meta property="og:title" content="You Cannot TAS PC Games">
  <meta property="og:description" content="Yes, you can TAS PC games!">
  <meta property="og:site_name" content="youcannottaspcgames.com">
  <meta name="keywords" content="TAS, Portal, Half-Life, Quake">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>Yes, you can TAS PC games!</h1>
    <nav>
      <ul>
        <li><a href="https://github.com/OutOfBoundsOffice/SourcePauseTool">SourcePauseTool</a></li>
        <li><a href="https://github.com/p2sr/SourceAutoRecord">SourceAutoRecord</a></li>
        <li><a href="https://github.com/lipsanen/TASQuake">TASQuake</a></li>
        <li><a href="https://github.com/YaLTeR/BunnymodXT">BunnymodXT</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="controls">
      <button id="sort-btn">Sort by Date (Newest to Oldest)</button>
      <div>
        <label for="game-filter">Filter by Game: </label>
        <select id="game-filter">
          <option value="All">All</option>
        </select>
      </div>
    </div>
    <div class="entries" id="entries"></div>
  </main>

  <script src="main.js"></script>

</body>

</html>
